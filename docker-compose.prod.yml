version: '3.8'
services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${API_DATABASE_URL}
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - GRAPH_API_KEY=${GRAPH_API_KEY}
      - NETWORK_ID=${NETWORK_ID}
      - CDP_API_KEY_NAME=${CDP_API_KEY_NAME}
      - CDP_API_KEY_PRIVATE_KEY=${CDP_API_KEY_PRIVATE_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_PRIVATE_KEY=${AGENT_PRIVATE_KEY}
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - WS_PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose:
      - "3000"

  indexer_agent:
    build:
      context: .
      dockerfile: packages/indexer-agent/Dockerfile.prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${INDEXER_AGENT_DATABASE_URL}
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - GRAPH_API_KEY=${GRAPH_API_KEY}
      - ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
      - VIC_PRIVATE_KEY=${VIC_PRIVATE_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile.prod
    ports:
      - "3003:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3001
      - NEXT_PUBLIC_ONCHAINKIT_API_KEY=${NEXT_PUBLIC_ONCHAINKIT_API_KEY}
      - NEXT_PUBLIC_ALCHEMY_API_KEY=${ALCHEMY_API_KEY}
    expose:
      - "3000"
    depends_on:
      - api

  postgres:
    image: ankane/pgvector:v0.5.1
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/multiple-databases.sh:/docker-entrypoint-initdb.d/multiple-databases.sh
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=api,analysis_agent,indexer_agent,permit_agent,counsellor_agent
    command: ["postgres", "-c", "shared_preload_libraries=vector"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "5672"
      - "15672"

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  default:
    driver: bridge
