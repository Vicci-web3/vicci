services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    volumes:
      - .:/usr/src/app:cached
      - /usr/src/app/node_modules
      - /usr/src/app/packages/api/node_modules
      - /usr/src/app/packages/shared/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: ${API_DATABASE_URL}
      NODE_ENV: development
      RABBITMQ_URL: amqp://rabbitmq:5672
      GRAPH_API_KEY: ${GRAPH_API_KEY}
    command: pnpm dev
    env_file: .env

  indexer_agent:
    build:
      context: .
      dockerfile: packages/indexer-agent/Dockerfile
    volumes:
      - .:/usr/src/app:cached
      - /usr/src/app/node_modules
      - /usr/src/app/packages/indexer-agent/node_modules
      - /usr/src/app/packages/shared/node_modules
    environment:
      DATABASE_URL: ${INDEXER_AGENT_DATABASE_URL}
      NODE_ENV: development
      RABBITMQ_URL: amqp://rabbitmq:5672
      GRAPH_API_KEY: ${GRAPH_API_KEY}
    command: pnpm dev
    depends_on:
      - rabbitmq
      - postgres
    env_file:
      - .env
      - .env.graph

  permit_agent:
    build:
      context: .
      dockerfile: packages/permit-agent/Dockerfile
    volumes:
      - .:/usr/src/app:cached
      - /usr/src/app/node_modules
      - /usr/src/app/packages/permit-agent/node_modules
      - /usr/src/app/packages/shared/node_modules
    environment:
      DATABASE_URL: ${PERMIT_AGENT_DATABASE_URL}
      NODE_ENV: development
      RABBITMQ_URL: amqp://rabbitmq:5672
    command: pnpm dev
    depends_on:
      - rabbitmq
      - postgres
    env_file: .env

  analysis_agent:
    build:
      context: .
      dockerfile: packages/analysis-agent/Dockerfile
    volumes:
      - .:/usr/src/app:cached
      - /usr/src/app/node_modules
      - /usr/src/app/packages/analysis-agent/node_modules
      - /usr/src/app/packages/shared/node_modules
    environment:
      DATABASE_URL: ${ANALYSIS_AGENT_DATABASE_URL}
      NODE_ENV: development
      RABBITMQ_URL: amqp://rabbitmq:5672
    command: pnpm dev
    depends_on:
      - rabbitmq
      - postgres
    env_file: .env

  targeting_agent:
    build:
      context: .
      dockerfile: packages/targeting-agent/Dockerfile
    volumes:
      - .:/usr/src/app:cached
      - /usr/src/app/node_modules
      - /usr/src/app/packages/targeting-agent/node_modules
      - /usr/src/app/packages/shared/node_modules
    environment:
      DATABASE_URL: ${TARGETING_AGENT_DATABASE_URL}
      NODE_ENV: development
      RABBITMQ_URL: amqp://rabbitmq:5672
    command: pnpm dev
    depends_on:
      - rabbitmq
      - postgres
    env_file: .env

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:15-alpine
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: "api,analysis_agent,indexer_agent,permit_agent,targeting_agent"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data: 